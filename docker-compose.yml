# Production setup: runs the published images, no source code needed.
# Put this file next to .env, config/ and vocabulary/, then:
#   docker network create fairgraph_net    (once)
#   docker compose pull && docker compose up -d
# The example database "questionnaires" is optional, see docker-compose.databases.yml.
# The site is served on 127.0.0.1:3000, for the nginx reverse proxy on this host (https).
services:

  central_router:
    image: frnzdock/fairgraph-api:latest
    restart: unless-stopped
    container_name: central_router
    # 0.0.0.0 inside the container; no ports are published, the frontend reaches it over fairgraph_net
    command: [ "uvicorn", "central_router:app", "--host", "0.0.0.0", "--port", "8000" ]
    # SELinux: lets the router use the Docker socket to start databases
    security_opt:
      - label=disable
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:Z
      - ./config:/app/config:Z
    environment:
      - ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      - AUTH_MODE=${AUTH_MODE:-oidc}
      # Only hashed passwords can log in
      - ALLOW_PLAINTEXT_PASSWORDS=${ALLOW_PLAINTEXT_PASSWORDS:-false}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - LLM_EXPANSION_TIMEOUT=${LLM_EXPANSION_TIMEOUT}
      - LLM_PREP_TIMEOUT=${LLM_PREP_TIMEOUT:-240}
      - RESULT_CACHE_TTL=${RESULT_CACHE_TTL:-600}
      - LLM_SEARCH_TIMEOUT=${LLM_SEARCH_TIMEOUT}
      - LLM_SEARCH_ENABLED=${LLM_SEARCH_ENABLED}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL}
      - CUSTOM_MODEL=${CUSTOM_MODEL}
      # Images the router starts for each database created in the Admin Panel
      - API_IMAGE=${API_IMAGE:-frnzdock/fairgraph-api:latest}
      - FUSEKI_IMAGE=${FUSEKI_IMAGE:-frnzdock/fairgraph-fuseki:latest}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-https://proxy.sram.surf.nl}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - OIDC_SCOPE=${OIDC_SCOPE}
      - OIDC_USERNAME_CLAIM=${OIDC_USERNAME_CLAIM}
      - OIDC_ROLE_CLAIM=${OIDC_ROLE_CLAIM}
      - OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM}
      - OIDC_ADMIN_ENTITLEMENTS=${OIDC_ADMIN_ENTITLEMENTS:-}
      - OIDC_USER_ENTITLEMENTS=${OIDC_USER_ENTITLEMENTS:-}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE}
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --method=GET http://127.0.0.1:8000/health -O /dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: frnzdock/fairgraph-frontend:latest
    restart: unless-stopped
    container_name: frontend
    # Only reachable from this host: nginx forwards https to it
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      central_router:
        condition: service_healthy

networks:
  default:
    name: fairgraph_net
    external: true
